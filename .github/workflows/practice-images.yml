name: Practice image test

# Boots community CyberPatriot practice images (VMware) under QEMU/KVM on a
# Linux runner, then runs Audit -> Harden -> reboot -> Audit inside each one
# and saves the image's own scoring report before and after.
on:
  push:
    branches: [image-test]
    paths: ['images/**', 'scripts/**', '.github/workflows/practice-images.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated image keys to run (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: troy-win10
            row: 2
            title: TROY WINDOWS 10 MOCK
            drive_id: 1jz8YMa7VOimnV9ErbkWOmHtBavlBwOqc
            size: 17242745796
            extra_scoring: 1t0k-VgvMBZWzGhDM8GNWbJLWStP1z5T0
          - key: beyond-journeys-end
            row: 3
            title: BEYOND JOURNEY'S END (Server 2022)
            drive_id: 1PRe5T9WXljVBh2e9CBqCpzObezsBb-HH
            size: 4403987049
            extra_scoring: ''
          - key: middlesea-hospital
            row: 4
            title: MIDDLESEA HOSPITAL (Server 2025)
            drive_id: 1zIJsxN4fqYn-W4-8u-O6UZeOlGc3sXD9
            size: 23206855171
            extra_scoring: ''
          - key: ppth-win11
            row: 9
            title: PRINCETON-PLAINSBORO TEACHING HOSPITAL (Windows 11)
            drive_id: 1RqOvBrkJjmhIVPqIv1YQ355WzQZNEKas
            size: 25274712150
            extra_scoring: ''
          # Windows images recommended in akshayrohatgi.com "How To Win CyberPatriot"
          - key: my-little-pony
            row: blog
            title: MY LITTLE PONY (Windows 10)
            drive_id: 1Og8lIMVqGKKenFXTpWYhA8X-szXyRtcY
            size: 11644203438
            extra_scoring: ''
          - key: king-arthurs-castle
            row: blog
            title: KING ARTHUR'S CASTLE (Server 2019)
            drive_id: 13OBAXsv408TQJ-WtNMc-mUEe2IBvI-UV
            size: 6274040106
            extra_scoring: ''
          - key: among-the-reindeer
            row: blog
            title: AMONG THE REINDEER (Windows 10)
            drive_id: 1h1P-BAwL5Pdm6l1GwWmbbDb2BnW3M6UE
            size: 13067625274
            extra_scoring: ''
          - key: mushroom-kingdom
            row: blog
            title: MUSHROOM KINGDOM SERVER (Server 2019)
            drive_id: 1KR1mnH5k5XGTOEJ-FdnYbZvLl12yMlQO
            size: 10078656482
            extra_scoring: ''
            archive_pw: MushroomMan64
          - key: cincinnati-zoo
            row: blog
            title: THE CINCINNATI ZOO (Windows 10)
            drive_id: 1ai3vff_pS_rABc8hsnE_0uv08MOZiB1W
            size: 15015488370
            extra_scoring: ''
          - key: santas-workshop
            row: blog
            title: SANTA'S WORKSHOP (Windows 10)
            drive_id: 1T7Lj5rHqq3JD2O1tZf_24vTytdOKytXO
            size: 7153703100
            extra_scoring: ''
          - key: kalipatriot-win10
            row: blog
            title: WINDOWS 10 PRACTICE (KaliPatriot)
            drive_id: 1FzzYG7haDwrz4D69MtKGDifDpqNWcg5q
            size: 3580538533
            extra_scoring: ''
    steps:
      - uses: actions/checkout@v4

      - name: Run image
        env:
          KEY: ${{ matrix.key }}
          TITLE: ${{ matrix.title }}
          DRIVE_ID: ${{ matrix.drive_id }}
          EXPECT_SIZE: ${{ matrix.size }}
          EXTRA_SCORING_ID: ${{ matrix.extra_scoring }}
          ARCHIVE_PW: ${{ matrix.archive_pw }}
          ONLY: ${{ inputs.only }}
        run: bash images/run-image.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.key }}
          path: out/${{ matrix.key }}
          if-no-files-found: warn
