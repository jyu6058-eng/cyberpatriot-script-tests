name: Image runner probe

on:
  push:
    branches: [image-test]
    paths: ['.github/workflows/image-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils ovmf libhivex-bin ntfs-3g 7zip unzip python3-hivex libwin-hivex-perl >/dev/null 2>&1 || echo "apt install failed: $?"
          qemu-system-x86_64 --version | head -1; which 7z hivexregedit python3; python3 -c 'import hivex; print("pyhivex ok")'; which hivexsh ntfs-3g qemu-storage-daemon || true
          ls /usr/share/OVMF/ || true
          sudo modprobe nbd max_part=16 && ls /dev/nbd0 && echo "NBD OK" || echo "NBD MISSING"
          qemu-system-x86_64 -device help 2>/dev/null | grep -iE 'mptsas|lsi|nvme|ahci|e1000|vmxnet|pvscsi' || true
      - name: List archives (sparse head+tail trick)
        run: |
          list() {
            id=$1; size=$2; name=$3
            echo "=================== $name ($size bytes)"
            truncate -s "$size" "a.$name"
            curl -sSL -r 0-1048575 "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" | dd of="a.$name" conv=notrunc status=none
            start=$((size - 33554432))
            curl -sSL -r "$start-$((size-1))" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" | dd of="a.$name" bs=1M seek=$start oflag=seek_bytes conv=notrunc status=none
            7z l -p- "a.$name" 2>&1 | tail -n 40 || true
            rm -f "a.$name"
          }
          list 1PRe5T9WXljVBh2e9CBqCpzObezsBb-HH 4403987049 bje.7z
          list 1zIJsxN4fqYn-W4-8u-O6UZeOlGc3sXD9 23206855171 middlesea.zip
          list 1RqOvBrkJjmhIVPqIv1YQ355WzQZNEKas 25274712150 ppth.7z
          list 1jz8YMa7VOimnV9ErbkWOmHtBavlBwOqc 17242745796 troy.7z
